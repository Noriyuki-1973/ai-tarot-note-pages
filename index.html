<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Note Assets Archive</title>
  <style>
    body { font-family: sans-serif; background: #f4f5f7; margin: 0; padding: 0; }
    header { background: #0b1b2b; color: #fff; padding: 1em; }
    .container { padding: 2em; }
    .card {
      background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      margin: 1em 0; overflow: hidden; max-width: 420px;
    }
    .cover-image { width: 100%; display: block; }
    .meta { padding: 1em; }
    .date { font-weight: bold; color: #0044cc; }
  </style>
</head>
<body>
  <header>
    <h1>Note Assets Archive</h1>
    <a href="latest/index.html" style="color:#fff; float:right;">Latest</a>
  </header>
  <div class="container">
    <div class="card">
      <img src="latest/cover.png" alt="cover" class="cover-image">
      <div class="meta">
        <div class="date">最新: $DATE</div>
        <a href="latest/index.html">Go to latest</a>
      </div>
    </div>
  </div>
</body>
</html>
